<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivio · Diario di bordo</title>
  <meta name="description" content="Tutti i pensieri del diario, da leggere per gruppo.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#d6d8df" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161e" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/fonts/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="salta" href="#contenuto">Vai al contenuto</a>

  <header class="barra">
    <div class="barra-dentro">
      <a class="marchio" href="/">
        <span class="striscia" aria-hidden="true"><i data-gruppo="anno-1"></i><i data-gruppo="anno-2"></i><i data-gruppo="anno-3"></i><i data-gruppo="anno-4"></i><i data-gruppo="anno-5"></i><i data-gruppo="fuori-corso"></i><i data-gruppo="ex-allievi"></i><i data-gruppo="docenti"></i></span>
        Diario di bordo
      </a>
      <nav aria-label="Sezioni">
        <a href="/">Scrivi</a>
        <a href="/archivio" aria-current="page">Archivio</a>
      </nav>
    </div>
  </header>

  <main id="contenuto" class="pagina">
    <section class="intestazione">
      <h1>Archivio</h1>
      <p>Tutti i pensieri del diario, dal più recente. Scegli un gruppo o cerca una parola.</p>
    </section>

    <div class="archivio-colonna">
    <div class="spettro-box" id="spettro-box" hidden>
      <div class="spettro-didascalia" aria-hidden="true">
        <span>Chi scrive nel diario</span>
        <span><b id="spettro-totale"></b> pensieri</span>
      </div>
      <div class="spettro" id="spettro" aria-hidden="true"></div>
    </div>

    <div class="filtri" id="filtri" role="group" aria-label="Filtra per gruppo"></div>

    <div class="ricerca">
      <label class="sr" for="cerca">Cerca nei pensieri</label>
      <svg class="icona" aria-hidden="true"><use href="#i-cerca"/></svg>
      <input type="search" id="cerca" placeholder="Cerca una parola…" autocomplete="off" enterkeyhint="search">
    </div>

    <div class="filtro-data">
      <div class="filtri periodi" id="periodi" role="group" aria-label="Filtra per data" data-testo-aria-label="archivio.data.gruppo">
        <button type="button" class="filtro" data-periodo="" aria-pressed="true" data-testo="archivio.data.sempre">Sempre</button>
        <button type="button" class="filtro" data-periodo="oggi" aria-pressed="false" data-testo="archivio.data.oggi">Oggi</button>
        <button type="button" class="filtro" data-periodo="ieri" aria-pressed="false" data-testo="archivio.data.ieri">Ieri</button>
        <button type="button" class="filtro" data-periodo="settimana" aria-pressed="false" data-testo="archivio.data.settimana">Ultima settimana</button>
        <button type="button" class="filtro" data-periodo="mese" aria-pressed="false" data-testo="archivio.data.mese">Ultimo mese</button>
      </div>
      <div class="giorno-scelto">
        <label for="giorno" data-testo="archivio.data.giorno">Un giorno preciso</label>
        <input type="date" id="giorno" min="1970-01-01" max="9999-12-31">
      </div>
    </div>

    <p class="riepilogo" id="riepilogo" tabindex="-1" aria-live="polite"></p>

    <ol class="elenco" id="elenco"></ol>

    <nav class="paginazione" id="paginazione" aria-label="Pagine" hidden>
      <button class="bottone secondario" id="prec" type="button">
        <svg class="icona" aria-hidden="true"><use href="#i-sinistra"/></svg>Più recenti
      </button>
      <span class="pos" id="pos"></span>
      <button class="bottone secondario" id="succ" type="button">
        Più vecchi<svg class="icona" aria-hidden="true"><use href="#i-destra"/></svg>
      </button>
    </nav>
    </div>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cerca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-sinistra" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-destra" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  </svg>
  <script src="/comune.js"></script>
  <script src="/archivio.js"></script>
</body>
</html>
